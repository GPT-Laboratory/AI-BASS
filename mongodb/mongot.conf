syncSource:
  replicaSet:
    hostAndPort: "mongo:27017"
    username: mongotUser
    passwordFile: /tmp/mongot-password
    authSource: admin
    tls: false
    readPreference: primaryPreferred
storage:
  dataPath: "data/mongot"
server:
  grpc:
    address: "0.0.0.0:27028"
    tls:
      mode: "disabled"
metrics:
  enabled: false
  address: "0.0.0.0:9946"
healthCheck:
  address: "0.0.0.0:8080"
logging:
  verbosity: INFO